name: Playwright Tests (Allure Report)

# IMPORTANT — read before relying on this workflow:
# This suite drives a real, already-running CompleteFTP server (see playwright-framework/.env.example,
# default BASE_URL=https://localhost) — it is not an app this workflow builds/starts itself. GitHub's
# hosted `ubuntu-latest` runners cannot reach a server that only exists on your local machine or a
# private network. If that's your setup, change `runs-on` below to a self-hosted runner registered on
# the same network as the CompleteFTP instance, and point the BASE_URL variable at it. Set
# APP_USERNAME/APP_PASSWORD as repository secrets (Settings → Secrets and variables → Actions) — do
# not hardcode real credentials into this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright tests + publish Allure report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: playwright-framework
    env:
      CI: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://localhost' }}
      ENV: ${{ vars.ENV || 'ci' }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      ALLURE_RESULTS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-framework/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs the full suite. Playwright's own exit code is captured (not failed immediately) so the
      # Allure report generation/publish steps below still run even when tests fail — a failing run is
      # exactly when the report (with its failure screenshots/videos) is most useful.
      - name: Run Playwright tests
        id: run_tests
        run: npx playwright test
        continue-on-error: true

      - name: Fetch existing Allure report history (gh-pages)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Generate Allure report (with history trend)
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: playwright-framework/allure-results
          allure_history: allure-history
          allure_report: allure-history
          gh_pages: gh-pages-history/gh-pages

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Link Allure report in the job summary
        if: always()
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          echo "### 📊 Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to GitHub Pages: https://${REPO_OWNER}.github.io/${REPO_NAME}/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_First run only: enable Pages once under Settings → Pages → Source: \`gh-pages\` branch for the link above to go live._" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report (artifact, always available even without Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-framework/playwright-report
          retention-days: 14

      - name: Fail the job if any test failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "One or more Playwright tests failed — see the Allure report and the uploaded Playwright HTML report artifact above for details."
          exit 1
