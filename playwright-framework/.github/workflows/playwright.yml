name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-framework

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-framework/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'http://localhost' }}
          APP_USERNAME: ${{ secrets.TEST_USERNAME }}
          APP_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Redact masked password values from Allure results
        if: always()
        run: npm run allure:redact

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-framework/playwright-report/
          retention-days: 30

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: playwright-framework/test-results/
          retention-days: 7

      - name: Upload raw Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: playwright-framework/allure-results/
          retention-days: 30

      # --- Allure Report (published to GitHub Pages, viewable directly from the Actions run) ---
      # One-time manual setup required in this repo: Settings → Pages → Source: "Deploy from a
      # branch" → Branch: gh-pages / (root). The two steps below create/update that branch; they
      # cannot toggle the Pages setting itself.
      - name: Load previous Allure report history (for trend charts)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report (with history)
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: playwright-framework/allure-results
          allure_history: allure-history
          allure_report: allure-report
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Print Allure Report URL
        if: always()
        run: |
          echo "### Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"
